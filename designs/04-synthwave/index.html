<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>markli.info — 04 Neon Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0618;--bg2:#140a2e;--mag:#ff2bd6;--cy:#22e6ff;--sun1:#ffe066;--sun2:#ff3d81;--fg:#f2eaff;--dim:#a597c9;--card:rgba(20,10,46,.72)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.65 "Space Grotesk","Noto Sans SC",sans-serif;overflow-x:hidden}
html[data-lang=hant] body{font-family:"Space Grotesk","Noto Sans TC",sans-serif}
.disp{font-family:Orbitron,"Noto Sans SC",sans-serif}
html[data-lang=hant] .disp{font-family:Orbitron,"Noto Sans TC",sans-serif}
.mono{font-family:"Space Mono",monospace}
a{color:inherit;text-decoration:none}
/* ---------- hero scene ---------- */
.scene{position:relative;height:min(100vh,860px);min-height:620px;overflow:hidden;
  background:linear-gradient(180deg,#05020f 0%,#1a0838 45%,#3b0b4f 62%,#0a0618 62.2%)}
.stars{position:absolute;inset:0 0 40% 0;background-image:
  radial-gradient(1px 1px at 12% 20%,#fff 50%,transparent),radial-gradient(1px 1px at 32% 8%,#fff 50%,transparent),
  radial-gradient(1.5px 1.5px at 58% 26%,#fff 50%,transparent),radial-gradient(1px 1px at 76% 12%,#fff 50%,transparent),
  radial-gradient(1px 1px at 88% 34%,#fff 50%,transparent),radial-gradient(1px 1px at 6% 42%,#fff 50%,transparent),
  radial-gradient(1.5px 1.5px at 44% 40%,#cfe 50%,transparent),radial-gradient(1px 1px at 66% 4%,#fff 50%,transparent);opacity:.7}
.sunwrap{position:absolute;left:0;right:0;top:0;height:62%;overflow:hidden}
.sun{position:absolute;left:50%;bottom:0;width:min(440px,78vw);aspect-ratio:1;transform:translate(-50%,38%);border-radius:50%;
  background:linear-gradient(180deg,var(--sun1) 8%,#ff9f43 38%,var(--sun2) 70%,#b5179e 100%);
  box-shadow:0 0 80px rgba(255,61,129,.55),0 0 180px rgba(255,43,214,.3);
  -webkit-mask:linear-gradient(180deg,#000 48%,transparent 48% 52%,#000 52% 62%,transparent 62% 65.5%,#000 65.5% 74%,transparent 74% 78.5%,#000 78.5% 85%,transparent 85% 90.5%,#000 90.5%);
          mask:linear-gradient(180deg,#000 48%,transparent 48% 52%,#000 52% 62%,transparent 62% 65.5%,#000 65.5% 74%,transparent 74% 78.5%,#000 78.5% 85%,transparent 85% 90.5%,#000 90.5%)}
.floor{position:absolute;left:-50%;right:-50%;top:62%;bottom:-40%;perspective:320px;perspective-origin:50% 0}
.grid{position:absolute;inset:0;transform:rotateX(78deg);transform-origin:50% 0;
  background-image:linear-gradient(var(--mag) 2px,transparent 2px),linear-gradient(90deg,var(--mag) 2px,transparent 2px);
  background-size:60px 60px;animation:run 1.6s linear infinite;
  -webkit-mask:linear-gradient(180deg,transparent 0%,#000 30%);mask:linear-gradient(180deg,transparent 0%,#000 30%);
  filter:drop-shadow(0 0 6px var(--mag))}
@keyframes run{to{background-position:0 60px}}
.horizon{position:absolute;left:0;right:0;top:62%;height:2px;background:var(--cy);box-shadow:0 0 16px var(--cy),0 0 40px var(--cy)}
.mtn{position:absolute;left:0;right:0;top:calc(62% - 90px);height:90px;opacity:.9}
/* header */
header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(16px,4vw,48px);flex-wrap:wrap}
.logo{font-weight:900;letter-spacing:.18em;font-size:15px;color:var(--cy);text-shadow:0 0 10px var(--cy)}
nav{display:flex;gap:28px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
nav a{color:var(--dim)}nav a:hover{color:var(--fg);text-shadow:0 0 10px var(--mag)}
.langs{display:flex;gap:4px;padding:4px;border:1px solid rgba(34,230,255,.5);border-radius:999px;background:rgba(10,6,24,.5);backdrop-filter:blur(6px)}
.langs button{background:none;border:0;color:var(--dim);font:700 12px "Space Grotesk","Noto Sans SC",sans-serif;padding:5px 12px;border-radius:999px;cursor:pointer}
.langs button.on{background:var(--cy);color:#0a0618;box-shadow:0 0 14px var(--cy)}
/* hero text */
.hero{position:absolute;z-index:4;left:0;right:0;top:15%;text-align:center;padding:0 16px}
.kick{font-size:12px;letter-spacing:.4em;color:var(--cy);text-transform:uppercase;text-shadow:0 0 8px var(--cy)}
h1{position:relative;display:inline-block;margin:.12em 0 .1em;font-weight:900;font-size:clamp(56px,13vw,170px);line-height:1;letter-spacing:.04em;
  background:linear-gradient(180deg,#fff 0%,#ffd1f5 38%,#ff2bd6 52%,#6a00ff 53%,#22e6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,43,214,.55))}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent}
h1::before{animation:g1 3.2s infinite steps(1);clip-path:inset(0 0 60% 0)}
h1::after{animation:g2 3.2s infinite steps(1);clip-path:inset(62% 0 0 0)}
@keyframes g1{0%,88%,100%{transform:none}90%{transform:translate(-6px,-2px)}93%{transform:translate(5px,1px)}96%{transform:translate(-3px,0)}}
@keyframes g2{0%,88%,100%{transform:none}90%{transform:translate(6px,2px)}94%{transform:translate(-5px,0)}97%{transform:translate(3px,-1px)}}
.tag{max-width:640px;margin:0 auto;font-size:clamp(15px,1.8vw,19px);color:#e4d8ff;text-shadow:0 2px 10px #000}
.cta{display:inline-flex;gap:10px;margin-top:26px;padding:12px 26px;border:2px solid var(--mag);border-radius:4px;color:#fff;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;box-shadow:0 0 18px rgba(255,43,214,.6),inset 0 0 18px rgba(255,43,214,.35);background:rgba(10,6,24,.4)}
.cta:hover{background:var(--mag);color:#0a0618}
/* ---------- content ---------- */
main{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:40px clamp(16px,4vw,40px) 0}
.sec{margin:70px 0}
.sh{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.sh h2{margin:0;font-size:clamp(20px,3vw,30px);font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff,#c9b8ff 50%,#7a5cff 51%,#e1d6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sh::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--mag),var(--cy),transparent)}
.sh .n{font-size:12px;color:var(--cy)}
.neon{position:relative;background:var(--card);border-radius:14px;padding:2px;
  background-image:linear-gradient(var(--bg2),var(--bg2)),linear-gradient(120deg,var(--mag),var(--cy));background-origin:border-box;background-clip:padding-box,border-box;border:2px solid transparent}
.feat{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;box-shadow:0 0 40px rgba(255,43,214,.25),0 0 80px rgba(34,230,255,.12)}
.feat .l{padding:clamp(20px,3.5vw,40px)}
.badge{display:inline-block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#0a0618;background:var(--cy);padding:3px 10px;border-radius:3px;box-shadow:0 0 12px var(--cy)}
.feat h3{font-size:clamp(26px,3.6vw,44px);line-height:1.1;margin:16px 0 8px;font-weight:700}
.feat .sub{color:var(--mag);margin:0 0 18px;font-weight:500;text-shadow:0 0 12px rgba(255,43,214,.45)}
.tldr{color:#d9ccff;font-size:15px;padding:14px 16px;border-left:3px solid var(--cy);background:rgba(34,230,255,.06);border-radius:0 8px 8px 0}
.tldr b{display:block;color:var(--cy);font-size:11px;letter-spacing:.2em}
.facts{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid rgba(255,43,214,.3)}
.facts div{padding:22px 20px;border-bottom:1px solid rgba(255,43,214,.2);display:flex;flex-direction:column;justify-content:center}
.facts div:nth-child(odd){border-right:1px solid rgba(255,43,214,.2)}
.facts div:nth-last-child(-n+2){border-bottom:0}
.facts b{font:900 clamp(32px,4vw,50px)/1 Orbitron,sans-serif;color:#fff;text-shadow:0 0 10px var(--mag),0 0 30px var(--mag)}
.facts div:nth-child(2n) b{text-shadow:0 0 10px var(--cy),0 0 30px var(--cy)}
.facts span{font-size:12.5px;color:var(--dim);margin-top:8px}
.read{display:inline-block;margin-top:20px;color:var(--cy);font-weight:700;letter-spacing:.08em}
.read:hover{text-shadow:0 0 12px var(--cy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{padding:22px;border-radius:12px;background:var(--card);border:1px solid rgba(162,120,255,.28);transition:.25s;position:relative;overflow:hidden;display:block}
.card::before{content:"";position:absolute;inset:-1px;border-radius:12px;padding:1px;background:linear-gradient(120deg,var(--mag),var(--cy));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 40px rgba(255,43,214,.25)}
.card:hover::before{opacity:1}
.card .top{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.card h4{font-size:19px;line-height:1.3;margin:14px 0 8px}
.card p{margin:0;color:var(--dim);font-size:14px}
.card .s{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mag);border:1px solid var(--mag);padding:1px 6px;border-radius:3px}
.card .tp{display:inline-block;margin-top:16px;font-size:12px;color:var(--cy)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.box{padding:26px;border-radius:14px;background:var(--card);border:1px solid rgba(162,120,255,.22)}
.tps{display:flex;flex-wrap:wrap;gap:10px}
.tps a{padding:8px 16px;border-radius:999px;border:1px solid rgba(34,230,255,.45);color:var(--cy);font-size:14px}
.tps a:hover{background:var(--cy);color:#0a0618;box-shadow:0 0 16px var(--cy)}
.note{color:var(--dim);font-size:13px;margin-top:14px}
footer{margin-top:90px;padding:28px clamp(16px,4vw,40px) 44px;border-top:1px solid rgba(255,43,214,.3);text-align:center;color:var(--dim);font-size:13px;background:linear-gradient(180deg,transparent,rgba(255,43,214,.08))}
footer a{color:var(--cy)}
@media(max-width:820px){.feat,.two{grid-template-columns:minmax(0,1fr)}.facts{border-left:0;border-top:1px solid rgba(255,43,214,.3)}nav{display:none}.scene{min-height:560px;height:88vh}}
@media(prefers-reduced-motion:reduce){.grid,h1::before,h1::after{animation:none}.card{transition:none}}
</style>
</head>
<body>
<div class="scene">
  <div class="stars"></div>
  <div class="sunwrap"><div class="sun"></div></div>
  <svg class="mtn" viewBox="0 0 1200 90" preserveAspectRatio="none"><path d="M0 90 L90 40 L160 70 L260 10 L360 64 L430 36 L520 90 Z M680 90 L760 44 L840 72 L940 18 L1040 60 L1120 30 L1200 66 L1200 90 Z" fill="#1d0a36" stroke="#22e6ff" stroke-width="1.5" stroke-opacity=".7"/></svg>
  <div class="floor"><div class="grid"></div></div>
  <div class="horizon"></div>

  <header>
    <div class="logo disp">MARKLI.INFO</div>
    <nav class="mono"><a href="#list" data-i18n="nav_articles"></a><a href="#topics" data-i18n="nav_topics"></a><a href="#about" data-i18n="nav_about"></a></nav>
    <div class="langs"><button data-lang="en">EN</button><button data-lang="hans">简</button><button data-lang="hant">繁</button></div>
  </header>

  <div class="hero">
    <div class="kick mono">// essays from the edge of the future</div>
    <h1 class="disp" id="name"></h1>
    <p class="tag" data-i18n="tagline"></p>
    <a class="cta" href="#feat"><span data-i18n="featured"></span> ▸</a>
  </div>
</div>

<main>
  <section class="sec" id="feat">
    <div class="sh"><h2 class="disp" data-i18n="featured"></h2><span class="n mono" id="fdate"></span></div>
    <article class="neon feat">
      <div class="l">
        <span class="badge mono" data-i18n="latest"></span>
        <h3 data-a="0" data-f="title"></h3>
        <p class="sub" data-a="0" data-f="sub"></p>
        <div class="tldr"><b class="mono" data-i18n="tldr"></b><span data-a="0" data-f="tldr"></span></div>
        <a class="read" href="#"><span data-i18n="read"></span> →</a>
      </div>
      <div class="facts" id="facts"></div>
    </article>
  </section>

  <section class="sec" id="list">
    <div class="sh"><h2 class="disp" data-i18n="all_articles"></h2><span class="n mono" id="cnt"></span></div>
    <div class="cards" id="cards"></div>
    <p class="note mono">&gt; <span data-i18n="coming"></span></p>
  </section>

  <section class="sec two">
    <div class="box" id="topics">
      <div class="sh"><h2 class="disp" data-i18n="topics"></h2></div>
      <div class="tps" id="tps"></div>
    </div>
    <div class="box" id="about">
      <div class="sh"><h2 class="disp" data-i18n="about"></h2></div>
      <p data-i18n="intro" style="margin:0"></p>
      <p class="note"><b style="color:var(--mag)" data-i18n="now"></b> · <span data-i18n="now_text"></span></p>
    </div>
  </section>
</main>

<footer class="mono">© 2026 <span data-i18n="name"></span> · <span data-i18n="footer"></span> · <a href="#" data-i18n="subscribe"></a></footer>

<script src="../shared/content.js"></script>
<script>
window.onLang=(l)=>{
  const A=ML.ARTICLES,a=A[0];
  const h=document.getElementById("name");h.textContent=ML.t("name");h.dataset.t=ML.t("name");
  document.getElementById("fdate").textContent=ML.fmtDate(a.date);
  document.getElementById("cnt").textContent=String(A.length).padStart(2,"0");
  document.getElementById("facts").innerHTML=a.facts.map(f=>`<div><b>${f.n}</b><span>${f[l]}</span></div>`).join("");
  document.getElementById("cards").innerHTML=A.map(x=>`<a class="card" href="#"><div class="top mono"><span>${ML.fmtDate(x.date)}</span>${x.real?`<span>${x.mins} ${ML.t("min")}</span>`:`<span class="s">${ML.t("sample")}</span>`}</div><h4>${x.title[l]}</h4><p>${x.sub[l]}</p><span class="tp mono">#${ML.t(x.topic)}</span></a>`).join("");
  document.getElementById("tps").innerHTML=["t_ai","t_math","t_edu","t_tech","t_essay"].map(k=>`<a href="#">${ML.t(k)}</a>`).join("");
};
</script>
</body>
</html>
