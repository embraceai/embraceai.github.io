<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>markli.info — 03 Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@300;500;700;800&family=Noto+Sans+SC:wght@300;500;700&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3a6b;--deep:#0b2f58;--ink:#e8f1ff;--soft:rgba(232,241,255,.62);--faint:rgba(232,241,255,.14);--hi:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.65 "IBM Plex Mono","Noto Sans SC",monospace;overflow-x:hidden;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(232,241,255,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,241,255,.16) 1px,transparent 1px),
    linear-gradient(rgba(232,241,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,241,255,.06) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:-1px -1px}
html[data-lang=hant] body{font-family:"IBM Plex Mono","Noto Sans TC",monospace}
.cond{font-family:"Barlow Condensed","Noto Sans SC",sans-serif}
html[data-lang=hant] .cond{font-family:"Barlow Condensed","Noto Sans TC",sans-serif}
a{color:var(--ink)}
.sheet{max-width:1160px;margin:28px auto;padding:0 20px}
.frame{position:relative;border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:6px;padding:26px 30px 0}
/* zone markers along frame */
.zones{position:absolute;left:0;right:0;top:-22px;display:flex;justify-content:space-around;font-size:11px;color:var(--soft)}
.zones.v{top:0;bottom:0;left:-22px;right:auto;flex-direction:column;width:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.logo{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.logo small{font:400 11px "IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--soft);display:block}
nav{display:flex;gap:22px;font-size:12px;text-transform:uppercase;letter-spacing:.14em}
nav a{text-decoration:none;border-bottom:1px dashed transparent}nav a:hover{border-color:var(--ink)}
.langs{display:flex;border:1px solid var(--ink)}
.langs button{background:none;border:0;border-left:1px solid var(--ink);color:var(--ink);font:500 12px "IBM Plex Mono","Noto Sans SC",monospace;padding:5px 11px;cursor:pointer}
.langs button:first-child{border-left:0}
.langs button.on{background:var(--ink);color:var(--bg)}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;padding:56px 0 40px}
.dim-h{position:relative;height:18px;margin-bottom:10px;color:var(--soft);font-size:11px}
.dim-h::before{content:"";position:absolute;left:0;right:0;top:9px;border-top:1px solid var(--soft)}
.dim-h::after{content:"";position:absolute;left:0;right:0;top:3px;height:12px;border-left:1px solid var(--soft);border-right:1px solid var(--soft)}
.dim-h span{position:relative;z-index:1;background:var(--bg);padding:0 8px;margin-left:50%;transform:translateX(-50%);display:inline-block;white-space:nowrap}
.dim-h i{position:absolute;top:5px;width:0;height:0;border:4px solid transparent}
.dim-h i.l{left:1px;border-right:7px solid var(--soft);border-left:0}
.dim-h i.r{right:1px;border-left:7px solid var(--soft);border-right:0}
h1{font-family:"Barlow Condensed","Noto Sans SC",sans-serif;font-weight:800;font-size:clamp(64px,11vw,150px);line-height:.86;margin:0;text-transform:uppercase;letter-spacing:-.01em}
html[data-lang=hant] h1{font-family:"Barlow Condensed","Noto Sans TC",sans-serif}
h1 .ol{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.tag{font-size:16px;max-width:560px;margin:22px 0 0}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--soft)}
.leader{position:absolute;font-size:11px;color:var(--hi);white-space:nowrap}
.leader::before{content:"";position:absolute;right:100%;top:50%;width:70px;border-top:1px solid var(--hi);transform-origin:right;transform:rotate(-24deg)}
.leader::after{content:"";position:absolute;right:calc(100% + 62px);top:calc(50% + 27px);width:7px;height:7px;border-radius:50%;background:var(--hi)}
/* schematic (decorative svg) */
.schem{border:1px solid var(--faint);position:relative;min-height:300px}
.schem svg{width:100%;height:100%;display:block}
.schem .lbl{position:absolute;left:10px;top:8px}
/* sections */
.sec{border-top:1px solid var(--ink);padding:30px 0 34px;position:relative}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
.sec-h .no{width:42px;height:42px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:700 16px "Barlow Condensed",sans-serif;flex:none}
.sec-h h2{margin:0;font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sec-h .ln{flex:1;border-bottom:1px dashed var(--soft);transform:translateY(-6px)}
/* featured */
.feat{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border:1.5px solid var(--ink);background:rgba(11,47,88,.55)}
.feat .l{padding:28px;border-right:1px solid var(--ink)}
.feat h3{font-size:clamp(30px,4vw,48px);line-height:1;margin:8px 0 10px;font-weight:700;text-transform:uppercase}
.feat .sub{color:var(--hi);margin:0 0 18px}
.tldr{border:1px dashed var(--soft);padding:14px 16px;position:relative;margin-top:6px}
.tldr .lbl{position:absolute;top:-9px;left:12px;background:var(--deep);padding:0 6px;color:var(--hi)}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:20px;border:1.5px solid var(--ink);padding:9px 18px;text-decoration:none;text-transform:uppercase;letter-spacing:.14em;font-size:12px;background:var(--ink);color:var(--bg);font-weight:600}
.btn:hover{background:var(--hi);border-color:var(--hi)}
.facts{display:grid;grid-template-columns:1fr 1fr}
.facts div{padding:18px;border-bottom:1px solid var(--ink);border-left:1px solid var(--faint);position:relative}
.facts div:nth-child(odd){border-left:0}
.facts div:nth-last-child(-n+2){border-bottom:0}
.facts b{display:block;font:800 56px/1 "Barlow Condensed",sans-serif}
.facts span{font-size:11.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.facts em{position:absolute;top:8px;right:10px;font-style:normal;font-size:10px;color:var(--soft)}
/* details grid */
.details{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.det{border:1px solid var(--ink);padding:18px 18px 16px;position:relative;text-decoration:none;background:rgba(15,58,107,.7);transition:transform .2s,background .2s;display:block}
.det:hover{background:rgba(232,241,255,.08);transform:translate(-3px,-3px);box-shadow:3px 3px 0 var(--ink)}
.det .tagno{position:absolute;top:-14px;left:14px;background:var(--bg);border:1px solid var(--ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:11px}
.det h4{font-size:24px;line-height:1.05;margin:8px 0 10px;font-weight:700;text-transform:uppercase}
.det .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);border-top:1px dashed var(--faint);padding-top:8px;margin-top:12px}
.det .s{border:1px solid var(--hi);color:var(--hi);font-size:10px;padding:0 5px;text-transform:uppercase;letter-spacing:.1em}
.det .cut{position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;background:linear-gradient(135deg,transparent 50%,var(--ink) 50%)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px}
.topics{display:flex;flex-direction:column}
.topics a{display:flex;justify-content:space-between;text-decoration:none;padding:10px 0;border-bottom:1px dashed var(--faint);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.topics a span:last-child{font:12px "IBM Plex Mono",monospace;color:var(--soft)}
.topics a:hover{color:var(--hi)}
.note{font-size:12px;color:var(--soft);margin-top:14px}
/* title block */
.tb{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;border-top:2px solid var(--ink);margin:0 -30px;font-size:11px}
.tb div{border-left:1px solid var(--ink);padding:8px 12px;min-width:0}
.tb div:first-child{border-left:0}
.tb b{display:block;font:600 15px "Barlow Condensed","Noto Sans SC",sans-serif;letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
.tb .wide{grid-column:1/-1;border-left:0;border-top:1px solid var(--ink);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--soft)}
@media(max-width:880px){.hero,.feat,.two{grid-template-columns:minmax(0,1fr)}.feat .l{border-right:0;border-bottom:1px solid var(--ink)}.leader,.zones{display:none}.schem{min-height:220px}}
@media(max-width:560px){.frame{padding:18px 16px 0;outline-offset:4px}.tb{margin:0 -16px;grid-template-columns:1fr 1fr}.tb div:nth-child(3){border-left:0;border-top:1px solid var(--ink)}.tb div:nth-child(4){border-top:1px solid var(--ink)}nav{order:3;width:100%;gap:16px}.facts b{font-size:42px}.sheet{margin:14px auto;padding:0 12px}}
</style>
</head>
<body>
<div class="sheet"><div class="frame">
  <div class="zones"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
  <div class="zones v"><span>A</span><span>B</span><span>C</span><span>D</span></div>

  <header>
    <div class="logo cond">markli.info<small>DWG NO. ML-2026-001</small></div>
    <nav><a href="#" data-i18n="nav_articles"></a><a href="#" data-i18n="nav_topics"></a><a href="#" data-i18n="nav_about"></a></nav>
    <div class="langs"><button data-lang="en">EN</button><button data-lang="hans">简</button><button data-lang="hant">繁</button></div>
  </header>

  <section class="hero">
    <div>
      <div class="dim-h"><i class="l"></i><span id="dimw">⌀ 1 author · 3 locales</span><i class="r"></i></div>
      <h1 id="name"></h1>
      <p class="tag" data-i18n="tagline"></p>
      <p class="lbl" style="margin-top:26px">SCALE 1:1 · TOL ±0 · <span data-i18n="brand"></span></p>
    </div>
    <div class="schem">
      <span class="lbl">FIG. 0 — ζ(s) CRITICAL STRIP</span>
      <svg viewBox="0 0 400 300" fill="none" stroke="#e8f1ff" stroke-width="1">
        <g stroke-opacity=".35"><line x1="40" y1="150" x2="380" y2="150"/><line x1="60" y1="20" x2="60" y2="285"/></g>
        <rect x="160" y="20" width="120" height="265" stroke-dasharray="4 4" stroke-opacity=".6"/>
        <line x1="220" y1="20" x2="220" y2="285" stroke="#ffd166" stroke-width="1.6"/>
        <g fill="#ffd166" stroke="none"><circle cx="220" cy="118" r="3.5"/><circle cx="220" cy="182" r="3.5"/><circle cx="220" cy="92" r="3.5"/><circle cx="220" cy="208" r="3.5"/><circle cx="220" cy="64" r="3.5"/><circle cx="220" cy="236" r="3.5"/><circle cx="220" cy="44" r="3.5"/><circle cx="220" cy="256" r="3.5"/></g>
        <path d="M70 150 C120 40, 180 260, 220 150 S 320 40, 370 150" stroke-opacity=".55"/>
        <path d="M70 150 C120 260, 180 40, 220 150 S 320 260, 370 150" stroke-opacity=".25"/>
        <g font-family="IBM Plex Mono" font-size="10" fill="#e8f1ff" stroke="none" fill-opacity=".75">
          <text x="150" y="298">0</text><text x="276" y="298">1</text><text x="226" y="16" fill="#ffd166">Re(s) = ½</text><text x="300" y="146">σ</text><text x="66" y="30">t</text>
        </g>
        <g stroke-opacity=".7"><line x1="160" y1="292" x2="280" y2="292"/><path d="M160 289v6M280 289v6"/></g>
      </svg>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><span class="no">01</span><h2 class="cond" data-i18n="featured"></h2><span class="ln"></span><span class="lbl" id="fdate"></span></div>
    <article class="feat">
      <div class="l">
        <span class="lbl">DETAIL A · <span id="fmins"></span></span>
        <h3 class="cond" data-a="0" data-f="title"></h3>
        <p class="sub" data-a="0" data-f="sub"></p>
        <div class="tldr"><span class="lbl" data-i18n="tldr"></span><span data-a="0" data-f="tldr"></span></div>
        <a class="btn" href="#"><span data-i18n="read"></span> ⟶</a>
      </div>
      <div class="facts" id="facts"></div>
    </article>
  </section>

  <section class="sec">
    <div class="sec-h"><span class="no">02</span><h2 class="cond" data-i18n="all_articles"></h2><span class="ln"></span><span class="lbl" id="cnt"></span></div>
    <div class="details" id="list"></div>
    <p class="note">※ <span data-i18n="coming"></span></p>
  </section>

  <section class="sec two">
    <div>
      <div class="sec-h"><span class="no">03</span><h2 class="cond" data-i18n="topics"></h2><span class="ln"></span></div>
      <div class="topics cond" id="topics"></div>
    </div>
    <div>
      <div class="sec-h"><span class="no">04</span><h2 class="cond" data-i18n="about"></h2><span class="ln"></span></div>
      <p data-i18n="intro" style="margin:0"></p>
      <p class="note"><span class="lbl" data-i18n="now"></span> — <span data-i18n="now_text"></span></p>
    </div>
  </section>

  <div class="tb">
    <div><span class="lbl">TITLE</span><b>markli.info — <span data-i18n="nav_home"></span></b></div>
    <div><span class="lbl">DRAWN BY</span><b data-i18n="name"></b></div>
    <div><span class="lbl">DATE</span><b id="tbdate"></b></div>
    <div><span class="lbl">SHEET · REV</span><b>1 / 1 · C</b></div>
    <div class="wide"><span>© 2026 · <span data-i18n="footer"></span></span><a href="#" data-i18n="subscribe"></a></div>
  </div>
</div></div>
<script src="../shared/content.js"></script>
<script>
window.onLang=(l)=>{
  const A=ML.ARTICLES,a=A[0];
  const nm=ML.t("name");
  document.getElementById("name").innerHTML=l==="en"?`Xi<br><span class="ol">Li</span>`:`${nm[0]}<span class="ol">${nm.slice(1)}</span>`;
  document.getElementById("fdate").textContent=ML.fmtDate(a.date);
  document.getElementById("tbdate").textContent=a.date;
  document.getElementById("fmins").textContent=`${a.mins} ${ML.t("min")}`;
  document.getElementById("cnt").textContent=`QTY ${A.length}`;
  document.getElementById("facts").innerHTML=a.facts.map((f,i)=>`<div><em>${String.fromCharCode(65+i)}</em><b>${f.n}</b><span>${f[l]}</span></div>`).join("");
  document.getElementById("list").innerHTML=A.map((x,i)=>`<a class="det" href="#"><span class="tagno">${i+1}</span><span class="lbl">${ML.t(x.topic)}</span><h4 class="cond">${x.title[l]}</h4><div style="color:var(--soft);font-size:12.5px">${x.sub[l]}</div><div class="meta"><span>${x.date}</span>${x.real?`<span>${x.mins} ${ML.t("min")}</span>`:`<span class="s">${ML.t("sample")}</span>`}</div><span class="cut"></span></a>`).join("");
  const counts={t_ai:1,t_math:1,t_edu:1,t_tech:1,t_essay:1};
  document.getElementById("topics").innerHTML=Object.keys(counts).map((k,i)=>`<a href="#"><span>${String(i+1).padStart(2,"0")} · ${ML.t(k)}</span><span>[${counts[k]}]</span></a>`).join("");
};
</script>
</body>
</html>
