<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>markli.info — 02 Proof Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#282c34;--side:#21252b;--act:#1b1e23;--line:#181a1f;--fg:#abb2bf;--dim:#5c6370;--kw:#c678dd;--str:#98c379;--num:#d19a66;--fn:#61afef;--ty:#e5c07b;--red:#e06c75;--cy:#56b6c2;--sel:#2c313c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--act);color:var(--fg);height:100%}
body{font:14px/1.6 Inter,"Noto Sans SC",sans-serif;display:flex;flex-direction:column;min-height:100vh}
html[data-lang=hant] body{font-family:Inter,"Noto Sans TC",sans-serif}
.mono{font-family:"Fira Code","Noto Sans SC",monospace}
html[data-lang=hant] .mono{font-family:"Fira Code","Noto Sans TC",monospace}
a{color:inherit;text-decoration:none}
/* title bar */
.titlebar{display:flex;align-items:center;gap:14px;height:38px;padding:0 12px;background:var(--act);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:#ff5f56}.dots i:nth-child(2){background:#ffbd2e}.dots i:nth-child(3){background:#27c93f}
.menu{display:flex;gap:14px}.menu a:hover{color:var(--fg)}
.ttl{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;background:var(--side);border:1px solid #3a3f4b;border-radius:6px;overflow:hidden}
.langs button{background:none;border:0;color:var(--dim);font:600 12px Inter,"Noto Sans SC",sans-serif;padding:4px 10px;cursor:pointer}
.langs button.on{background:var(--fn);color:#10131a}
/* layout */
.ws{flex:1;display:grid;grid-template-columns:48px 240px minmax(0,1fr) 340px;min-height:0}
.actbar{background:var(--act);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px;border-right:1px solid var(--line)}
.actbar span{width:48px;height:44px;display:grid;place-items:center;color:var(--dim);border-left:2px solid transparent;font-size:18px}
.actbar span.on{color:var(--fg);border-left-color:var(--fn)}
.side{background:var(--side);border-right:1px solid var(--line);font-size:13px;overflow:auto}
.side h4{margin:0;padding:10px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.tree div{padding:3px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tree div:hover{background:var(--sel)}
.tree .d{color:var(--fg)}.tree .d::before{content:"▾ ";color:var(--dim)}
.tree .f{padding-left:30px}.tree .f.on{background:#2c3e5c;color:#fff}
.ic{display:inline-block;width:16px;font-size:11px;font-weight:700;color:var(--ty)}
.ic.lean{color:var(--fn)}.ic.md{color:var(--cy)}
.tree .s{font-size:10px;color:var(--dim);border:1px solid #3a3f4b;border-radius:3px;padding:0 4px;margin-left:6px}
.outline{border-top:1px solid var(--line);margin-top:10px}
#outline div{padding:3px 14px 3px 22px;color:var(--dim);font-size:12.5px}
#outline div::before{content:"§ ";color:var(--kw)}
/* editor */
.ed{background:var(--bg);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;background:var(--side);overflow-x:auto;scrollbar-width:none}
.tab{padding:9px 16px;font-size:12.5px;color:var(--dim);border-right:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--bg);color:#fff;border-top:2px solid var(--fn)}
.crumbs{padding:6px 18px;font-size:12px;color:var(--dim);border-bottom:1px solid #2f343d}
.code{flex:1;overflow:auto;padding:14px 0 40px;font-size:13.5px;line-height:1.75}
.ln{display:grid;grid-template-columns:52px minmax(0,1fr);min-width:0}
.ln b{font-weight:400;color:#495162;text-align:right;padding-right:18px;user-select:none}
.ln code{white-space:pre-wrap;word-break:break-word;font:inherit;padding-right:18px}
.ln.cur{background:#2c313a}.ln.cur b{color:var(--fg)}
.k{color:var(--kw)}.s1{color:var(--str)}.n{color:var(--num)}.f1{color:var(--fn)}.t{color:var(--ty)}.c{color:var(--dim);font-style:italic}.r{color:var(--red)}.cy{color:var(--cy)}
.hero-name{font:800 clamp(30px,4.5vw,54px)/1.05 Inter,"Noto Sans SC",sans-serif;color:#fff;letter-spacing:-.03em;margin:6px 0 2px}
html[data-lang=hant] .hero-name{font-family:Inter,"Noto Sans TC",sans-serif}
.runbtn{display:inline-block;background:var(--str);color:#10131a;font-weight:700;padding:2px 12px;border-radius:4px;margin-top:4px}
.runbtn:hover{filter:brightness(1.15)}
/* infoview */
.info{background:var(--side);border-left:1px solid var(--line);overflow:auto;font-size:13px}
.info h4{margin:0;padding:10px 16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.pane{padding:14px 16px;border-bottom:1px solid var(--line)}
.ok{color:var(--str);font-weight:700}
.goal{background:var(--bg);border:1px solid #3a3f4b;border-radius:6px;padding:12px;margin-top:10px;line-height:1.65}
.goal .lbl{color:var(--ty);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.facts div{background:var(--bg);border:1px solid #3a3f4b;border-radius:6px;padding:10px}
.facts b{display:block;font:700 22px "Fira Code",monospace;color:var(--num)}
.facts span{font-size:11.5px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips a{font-size:12px;padding:3px 9px;border-radius:12px;background:#2f3542;color:var(--fg)}
.chips a:hover{background:var(--fn);color:#10131a}
.status{height:26px;display:flex;align-items:center;gap:18px;padding:0 12px;background:#4078f2;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden}
.status .sp{flex:1}
.status .g{background:rgba(0,0,0,.18);padding:0 8px;height:100%;display:flex;align-items:center}
.terminal{border-top:1px solid #2f343d;background:var(--act);font-size:12.5px;padding:8px 18px 14px;color:var(--dim)}
.terminal .p{color:var(--str)}
@media(max-width:1180px){.ws{grid-template-columns:48px 220px minmax(0,1fr)}.info{grid-column:2/4;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:760px){.ws{grid-template-columns:minmax(0,1fr)}.actbar,.side{display:none}.info{grid-column:1}.menu{display:none}.ln{grid-template-columns:34px minmax(0,1fr)}.ln b{padding-right:10px}.status .hide{display:none}.ttl{text-align:left}}
</style>
</head>
<body>
<div class="titlebar">
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="menu"><a href="#" data-i18n="nav_articles"></a><a href="#" data-i18n="nav_topics"></a><a href="#" data-i18n="nav_about"></a></div>
  <div class="ttl mono">riemann.lean — markli.info</div>
  <div class="langs"><button data-lang="en">EN</button><button data-lang="hans">简</button><button data-lang="hant">繁</button></div>
</div>

<div class="ws">
  <div class="actbar"><span class="on">⎘</span><span>⌕</span><span>⑂</span><span>▷</span><span>◫</span></div>

  <aside class="side">
    <h4>Explorer</h4>
    <div class="tree mono" id="tree"></div>
    <div class="outline"><h4>Outline</h4><div id="outline"></div></div>
  </aside>

  <main class="ed">
    <div class="tabs mono"><div class="tab on">riemann.lean</div><div class="tab">README.md</div><div class="tab">topics.json</div></div>
    <div class="crumbs mono">markli.info › essays › 2026 › riemann.lean</div>
    <div class="code mono" id="code"></div>
    <div class="terminal mono" id="term"></div>
  </main>

  <aside class="info">
    <h4><span>Lean Infoview</span><span>▾</span></h4>
    <div class="pane">
      <div class="ok">✓ <span id="goalsdone">goals accomplished</span> 🎉</div>
      <div class="goal"><span class="lbl" data-i18n="tldr"></span><span data-a="0" data-f="tldr"></span></div>
      <div class="facts" id="facts"></div>
    </div>
    <div class="pane">
      <div class="lbl" style="color:var(--ty);font-size:11px;letter-spacing:.1em;text-transform:uppercase" data-i18n="topics"></div>
      <div class="chips" id="topics"></div>
    </div>
    <div class="pane">
      <div class="lbl" style="color:var(--ty);font-size:11px;letter-spacing:.1em;text-transform:uppercase" data-i18n="about"></div>
      <p style="margin:8px 0 0" data-i18n="intro"></p>
      <p style="margin:12px 0 0;color:var(--dim);font-size:12px">© 2026 <span data-i18n="name"></span> · <span data-i18n="footer"></span> · <a href="#" style="color:var(--fn)" data-i18n="subscribe"></a></p>
    </div>
  </aside>
</div>

<div class="status mono">
  <span class="g">⑂ main</span><span class="hide">⊘ 0 ⚠ 0</span><span class="sp"></span>
  <span class="hide" id="lncol">Ln 1, Col 1</span><span class="hide">Spaces: 2</span><span>UTF-8</span><span id="slang">EN</span><span class="hide">Lean 4</span>
</div>

<script src="../shared/content.js"></script>
<script>
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const files=["riemann","education","technology","mathematics","personal"];
window.onLang=(l)=>{
  const A=ML.ARTICLES,a=A[0];
  const T={en:"goals accomplished",hans:"所有目标已完成",hant:"所有目標已完成"};
  document.getElementById("goalsdone").textContent=T[l];
  document.getElementById("slang").textContent={en:"English",hans:"简体中文",hant:"繁體中文"}[l];
  document.getElementById("tree").innerHTML=
    `<div class="d">markli.info</div><div class="d" style="padding-left:22px">essays</div>`+
    A.map((x,i)=>`<div class="f${i?"":" on"}" title="${esc(x.title[l])}"><span class="ic lean">λ</span>${files[i]}.lean${x.real?"":`<span class=s>${ML.t("sample")}</span>`}</div>`).join("")+
    `<div class="f"><span class="ic md">M↓</span>README.md</div><div class="f"><span class="ic">{}</span>topics.json</div>`;
  const heads={en:["Tao spoke of 2050","The mathematician behind it","Experts + frontier AI","Proved, not yet understood","Is society ready?","Why so many PhDs?","The future of ordinary people","A new talent structure","What should we do?"],
    hans:["陶哲轩还在谈 2050","证明背后的数学家","顶尖人才 + 顶尖 AI","机器证明，人类未懂","社会准备好了吗？","为什么还培养博士？","普通人的未来","新的人才结构","我们该怎么办？"],
    hant:["陶哲軒還在談 2050","證明背後的數學家","頂尖人才 + 頂尖 AI","機器證明，人類未懂","社會準備好了嗎？","為什麼還培養博士？","普通人的未來","新的人才結構","我們該怎麼辦？"]};
  document.getElementById("outline").innerHTML=heads[l].map(h=>`<div>${esc(h)}</div>`).join("");
  const L=[
    `<span class="c">-- ${esc(ML.t("brand"))} · ${esc(ML.t("tagline"))}</span>`,
    `<span class="k">import</span> <span class="t">Mathlib.NumberTheory.LSeries</span>`,
    `<span class="k">import</span> <span class="t">Essays.AI.Future</span>`,
    ``,
    `<div class="hero-name">${esc(ML.t("name"))}</div>`,
    `<span class="c">/-! ${esc(ML.t("intro"))} -/</span>`,
    ``,
    `<span class="k">@[featured, date</span> := <span class="s1">"${a.date}"</span><span class="k">]</span>`,
    `<span class="k">theorem</span> <span class="f1">${esc(a.title[l])}</span>`,
    `    <span class="cy">(</span>subtitle <span class="k">:</span> <span class="s1">"${esc(a.sub[l])}"</span><span class="cy">)</span>`,
    `    <span class="cy">(</span>reading <span class="k">:</span> <span class="t">Minutes</span> := <span class="n">${a.mins}</span><span class="cy">)</span> <span class="k">:</span>`,
    `    <span class="t">Experts</span>.<span class="f1">underestimate</span> <span class="t">AI</span> <span class="k">:= by</span>`,
    ...a.facts.map(f=>`  <span class="f1">have</span> <span class="r">h${f.n.replace(/\W/g,"")}</span> <span class="k">:</span> <span class="n">${f.n}</span> <span class="c">-- ${esc(f[l])}</span>`),
    `  <span class="f1">exact</span> <span class="t">TLDR</span>  <a class="runbtn" href="#">▶ ${esc(ML.t("read"))}</a>`,
    ``,
    `<span class="c">-- ${esc(ML.t("all_articles"))}</span>`,
    `<span class="k">def</span> <span class="f1">archive</span> <span class="k">: List</span> <span class="t">Essay</span> := [`,
    ...A.map((x,i)=>`  <span class="cy">⟨</span><span class="s1">"${x.date}"</span>, <a href="#" class="s1" style="text-decoration:underline dotted">"${esc(x.title[l])}"</a>, <span class="n">${x.mins}</span><span class="cy">⟩</span>${i<A.length-1?",":""}${x.real?"":` <span class="c">-- ${esc(ML.t("sample"))}</span>`}`),
    `]`,
    ``,
    `<span class="c">-- ${esc(ML.t("coming"))}</span>`
  ];
  document.getElementById("code").innerHTML=L.map((c,i)=>`<div class="ln${i===8?" cur":""}" data-i="${i+1}"><b>${i+1}</b><code>${c||" "}</code></div>`).join("");
  document.querySelectorAll(".ln").forEach(r=>r.onmouseenter=()=>{document.querySelectorAll(".ln.cur").forEach(x=>x.classList.remove("cur"));r.classList.add("cur");document.getElementById("lncol").textContent=`Ln ${r.dataset.i}, Col 1`});
  document.getElementById("facts").innerHTML=a.facts.map(f=>`<div><b>${f.n}</b><span>${esc(f[l])}</span></div>`).join("");
  document.getElementById("topics").innerHTML=["t_ai","t_math","t_edu","t_tech","t_essay"].map(k=>`<a href="#">#${esc(ML.t(k))}</a>`).join("");
  document.getElementById("term").innerHTML=`<span class="p">❯</span> lake build <span style="color:var(--fg)">markli.info</span><br>✔ [1/1] ${A.length} essays · 3 locales · 0 errors`;
};
</script>
</body>
</html>
